name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install from the lock
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r example/requirements.lock

      - name: Fail if resolved versions differ from the lock
        run: |
          .venv/bin/python -m pip freeze | sort > resolved.txt
          sort example/requirements.lock > locked.txt
          diff locked.txt resolved.txt

      - name: Run tests
        run: .venv/bin/python -m pytest example/service/tests -q
